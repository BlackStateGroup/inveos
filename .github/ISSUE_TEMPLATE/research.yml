name: Upstream source assessment
description: Assess a GitHub project before integration
labels: []
body:
  - type: input
    id: repo
    attributes:
      label: Upstream GitHub repository
      placeholder: owner/repo
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Pinned commit or upstream release
      placeholder: 40 character SHA
    validations:
      required: true
  - type: textarea
    id: assessment
    attributes:
      label: Intended capability and test
      description: Evaluate narrow feature fit, security and synthetic-data acceptance.
    validations:
      required: true
  - type: textarea
    id: licence
    attributes:
      label: Licensing and data/terms review
      description: Full source, transitive components, models, data, patents and deployment terms.
    validations:
      required: true
