name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-application:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: inveos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inveos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable service credentials, never production credentials or secrets.
      INVEOS_TEST_ADMIN_DATABASE_URL: postgres://postgres:synthetic-ci-only@127.0.0.1:5432/inveos_test
      INVEOS_TEST_DATABASE_URL: postgres://inveos_app:synthetic-ci-only@127.0.0.1:5432/inveos_test
      INVEOS_TEST_BROWSER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Install locked application dependencies
        run: npm ci --no-audit --no-fund
      - name: Create restricted application role in disposable test database
        run: |
          psql "$INVEOS_TEST_ADMIN_DATABASE_URL" --set ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE inveos_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS PASSWORD 'synthetic-ci-only';
          GRANT CONNECT ON DATABASE inveos_test TO inveos_app;
          SQL
      - name: Lint
        run: npm run lint
      - name: Typecheck every workspace
        run: npm run typecheck
      - name: Build web application
        run: npm run build
      - name: Validate foundation sources and run Python tests
        run: npm run test:foundation
      - name: Exercise synthetic reference flow
        run: python3 -m examples.evidence_flow_demo
      - name: Run API integration tests against real PostgreSQL
        # This existing workspace command reads CI environment variables directly;
        # the root test:api command requires a developer's private .env file.
        # The two added browser journeys bring the measured suite close to 180s.
        # Individual worker/browser deadlines remain unchanged.
        run: timeout 240s npm test --workspace @inveos/api
      - name: Qualify isolated worker host with first-party probes
        run: timeout 90s python3 tools/probe_worker_isolation.py --image postgres:15
      - name: Retain fictional chronology browser render
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chronology-browser
          path: output/evals/chronology-desktop.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain fictional case search browser render
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: case-search-browser
          path: output/evals/case-search-desktop.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain fictional work discussion browser render
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: work-discussion-browser
          path: output/evals/work-discussion-desktop.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain fictional case graph browser render
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: case-graph-browser
          path: output/evals/case-graph-desktop.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain fictional manual source browser render
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: manual-source-browser
          path: output/evals/manual-source-desktop.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain fictional assigned work browser render
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: assigned-work-browser
          path: output/evals/assigned-work-desktop.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain fictional case lifecycle browser render
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: case-lifecycle-browser
          path: output/evals/case-lifecycle-desktop.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain fictional transcript browser render
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: transcript-browser
          path: output/evals/transcript-desktop.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain fictional case access browser render
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: case-access-browser
          path: output/evals/case-access-desktop.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain fictional preservation browser render
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preservation-browser
          path: output/evals/preservation-desktop.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain fictional case time browser render
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: case-time-browser
          path: output/evals/case-time-desktop.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Check tracked sources remain unchanged
        run: git diff --exit-code
      - name: Retain fictional document search browser render
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: document-search-browser
          path: output/evals/document-search-desktop.png
          if-no-files-found: ignore
          retention-days: 14
