name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-application:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: inveos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inveos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable service credentials, never production credentials or secrets.
      INVEOS_TEST_ADMIN_DATABASE_URL: postgres://postgres:synthetic-ci-only@127.0.0.1:5432/inveos_test
      INVEOS_TEST_DATABASE_URL: postgres://inveos_app:synthetic-ci-only@127.0.0.1:5432/inveos_test
      INVEOS_TEST_BROWSER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Install locked application dependencies
        run: npm ci --no-audit --no-fund
      - name: Create restricted application role in disposable test database
        run: |
          psql "$INVEOS_TEST_ADMIN_DATABASE_URL" --set ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE inveos_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS PASSWORD 'synthetic-ci-only';
          GRANT CONNECT ON DATABASE inveos_test TO inveos_app;
          SQL
      - name: Lint
        run: npm run lint
      - name: Typecheck every workspace
        run: npm run typecheck
      - name: Build web application
        run: npm run build
      - name: Recreate the fictional disclosure DOCX fixture
        run: node --import tsx tools/make_disclosure_docx_fixture.mjs
      - name: Validate foundation sources and run Python tests
        run: npm run test:foundation
      - name: Exercise synthetic reference flow
        run: python3 -m examples.evidence_flow_demo
      - name: Run API integration tests against real PostgreSQL
        # This existing workspace command reads CI environment variables directly;
        # the root test:api command requires a developer's private .env file.
        # The growing serial suite includes actual database and browser journeys.
        # Individual worker/browser deadlines remain unchanged.
        run: timeout 360s npm test --workspace @inveos/api
      - name: Exercise development effect replay in the actual browser
        run: |
          NODE_ENV=development npm run build --workspace @inveos/web
          timeout 120s node --import tsx --test --test-concurrency=1 --test-name-pattern='real browser offers case invitations|real browser records source-use|real browser records expenses|real browser recovers editable DOCX|real browser independently reviews and releases a redacted DOCX|real browser opens exact report and transcript review contexts|real browser opens exact source expense and correspondence review records|real browser assigns independent reviews|real browser discovers completed assignment history|real browser inspects OSINT captures|real browser compares speech audio|real browser prints collected-source lineage' apps/api/test/api.test.ts
      - name: Render and re-save the fictional DOCX in LibreOffice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-noto-cjk poppler-utils
          timeout 120s python3 tools/eval_report_docx_office.py --output output/evals/docx-office
          timeout 120s python3 tools/eval_speech_docx_office.py
          timeout 120s python3 tools/eval_speech_docx_office.py --kind collection
      - name: Qualify isolated worker host with first-party probes
        run: timeout 90s python3 tools/probe_worker_isolation.py --image postgres:15
      - name: Retain fictional chronology browser render
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chronology-browser
          path: output/evals/chronology-desktop.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain fictional case search browser render
        if: always()
