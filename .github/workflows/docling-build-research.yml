name: Pinned Docling research build

on:
  pull_request:
    paths:
      - '.github/workflows/docling-build-research.yml'
      - 'tools/build_docling_research.py'
      - 'tools/bounded_process.py'
      - 'tools/probe_worker_isolation.py'
      - 'research/runtime_artifacts/docling-build.*'
      - 'tests/test_docling_research_build.py'
      - 'tools/audit_native_wheels.py'
      - 'tools/audit_runtime_image.py'
      - 'tools/experiment_native_pdf.py'
      - 'tools/experiment_tesseract_supplier.py'
      - 'tools/run_tesseract_supplier.py'
      - 'tools/run_ocr_document.py'
      - 'tools/prepare_ocr_worker.py'
      - 'research/runtime_artifacts/ocr-wheels.json'
      - 'tools/verify_ocr_derivative.py'
      - 'tools/verify_document_package.py'
      - 'apps/api/src/ocr-derivative.ts'
      - 'apps/api/src/document-derivative.ts'
      - 'apps/api/src/integrity-jobs.ts'
      - 'apps/api/migrations/030_ocr_document_derivatives.sql'
      - 'apps/api/test/ocr-worker.integration.ts'
      - 'apps/api/test/ocr-derivative.test.ts'
      - 'apps/api/test/support/ocr-fixture.ts'
      - 'research/runtime_artifacts/tesseract-baseline.lock.json'
      - 'tools/supplier_scan_fixture.py'
      - 'tools/run_ocr_corpus.py'
      - 'tests/test_ocr_corpus.py'
      - 'research/runtime_artifacts/tesseract-baseline.Dockerfile'
      - 'tests/test_supplier_scan_fixture.py'
      - 'tools/experiment_pdf_render.py'
      - 'tools/run_pdf_render_fixture.py'
      - 'tools/pdf_render.py'
      - 'tools/run_raster_document.py'
      - 'tools/pdf_render_limits.py'
      - 'apps/api/src/raster-derivative.ts'
      - 'apps/api/test/raster-derivative.test.ts'
      - 'apps/api/test/raster-native.integration.ts'
      - 'tests/test_pdf_render_limits.py'
      - 'tools/run_native_pdf_fixture.py'
      - 'tools/prepare_document_worker.py'
      - 'tools/run_native_document.py'
      - 'apps/api/src/container-worker.ts'
      - 'apps/api/src/native-document-worker.ts'
      - 'apps/api/test/native-worker.integration.ts'
      - 'research/document_processing/*.py'
      - 'tests/test_native_boundary.py'
      - 'tests/test_document_processing.py'
      - 'tools/synthetic_pdf.py'
      - 'tools/pdf_text_coverage.py'
      - 'tests/test_pdf_text_coverage.py'
      - 'tests/test_synthetic_pdf.py'
      - 'tools/inspect_image_libraries.py'
      - 'tests/test_runtime_image_audit.py'
      - 'tests/test_native_wheel_audit.py'
      - 'research/runtime_artifacts/docling-native-*.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-source-wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: inveos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inveos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INVEOS_TEST_ADMIN_DATABASE_URL: postgres://postgres:synthetic-ci-only@127.0.0.1:5432/inveos_test
      INVEOS_TEST_DATABASE_URL: postgres://inveos_app:synthetic-ci-only@127.0.0.1:5432/inveos_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked first-party application dependencies and create test role
        run: |
          npm ci --no-audit --no-fund
          psql "$INVEOS_TEST_ADMIN_DATABASE_URL" --set ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE inveos_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS PASSWORD 'synthetic-ci-only';
          GRANT CONNECT ON DATABASE inveos_test TO inveos_app;
          SQL
      - name: Acquire exact source without executing it
        run: timeout 120s python3 tools/mine_sources.py --fetch docling-project/docling
      - name: Acquire only hash-locked build wheels without installation
        run: |
          timeout 120s python3 -m pip download --only-binary=:all: --require-hashes -r research/runtime_artifacts/docling-build.lock --dest .research-cache/docling-build-wheels
      - name: Acquire digest-pinned disposable Python build image
        run: timeout 120s docker pull python@sha256:623674a14ef93d052bb9b0de4dbf5f28eb578a35263838941cc8aa43213c1487
      - name: Qualify image then build exact source twice without network
        run: timeout 180s python3 tools/build_docling_research.py --source .research-cache/sources/docling-project/docling --wheels .research-cache/docling-build-wheels --retain-wheel
      - name: Acquire locked runtime wheels for static inspection only
        run: |
          timeout 120s python3 -m pip download --only-binary=:all: --require-hashes -r research/runtime_artifacts/docling-native-cp312.lock --dest .research-cache/docling-locked-cp312
      - name: Independently verify native dependency inventory without loading binaries
        run: |
          python3 tools/audit_native_wheels.py .research-cache/docling-locked-cp312 --inventory research/runtime_artifacts/docling-native-cp312.json --output .research-cache/native-elf.json --compare-readelf
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          actual=json.loads(Path('.research-cache/native-elf.json').read_text())
          expected=json.loads(Path('research/runtime_artifacts/docling-native-elf.json').read_text())
          print(actual.pop('independentComparison'))
          expected.pop('independentComparison')
          if actual != expected:
              raise SystemExit('Native inventory drift')
          print('Native inventory reproduced exactly')
          PYTHON
      - name: Inspect native library candidates and package notices in the pinned image
        run: timeout 120s python3 tools/audit_runtime_image.py --output .research-cache/image-inspection.json
      - name: Run isolated fictional native PDF experiment
        run: timeout 240s python3 tools/experiment_native_pdf.py
      - name: Qualify the selected runtime for this worker acceptance run
        run: |
          timeout 90s python3 - <<'PYTHON'
          import json
          from pathlib import Path
          from datetime import datetime,timezone
          from tools.probe_worker_isolation import run_probe
          from tools.build_docling_research import IMAGE
          Path('.research-cache/worker-qualification.json').write_text(json.dumps({**run_probe(IMAGE,runtime=True),'checkedAt':datetime.now(timezone.utc).isoformat()}))
          PYTHON
      - name: Measure isolated fictional scanned supplier OCR baseline
        run: |
          npm run build
          timeout 600s python3 tools/experiment_tesseract_supplier.py --case-acceptance --adverse-corpus
      - name: Render fictional original pages twice inside isolation
        run: |
          timeout 180s python3 tools/experiment_pdf_render.py > .research-cache/render-output.json
          node --import tsx --test apps/api/test/raster-native.integration.ts
      - name: Exercise leased native jobs against PostgreSQL and actual daemon failures
        run: timeout 360s node --import tsx --test --test-concurrency=1 apps/api/test/native-worker.integration.ts
      - name: Keep all acquired and generated third-party files untracked
        run: git diff --exit-code
